[flake8]
# NOTE: this file is duplicated verbatim at qols/setup.cfg. The store's zip
# only ever contains the qols/ folder (it's the directory metadata.txt lives
# in), so this repo-root copy is never seen by the store's scanner — it only
# serves local `flake8 <path>` runs invoked from the repo root (per
# CLAUDE.md's workflow). qols/setup.cfg is the copy that actually reaches
# the store. Keep both identical; per-file-ignores below intentionally use
# a leading bare `*` (not a `qols/`-prefixed path) so the same globs match
# regardless of whether flake8 is invoked from the repo root or from inside
# qols/ (the store's presumed cwd) — see doc/PR_153_followup.md for the
# qgis-plugin-store-compliance skill's Gotcha 1/2 this works around.
max-line-length = 119
exclude =
    .git,
    __pycache__,
    .venv,
    tests

per-file-ignores =
    # parameters_inspector.py: embedded HTML/CSS/JS popup template kept as
    # single-line CSS rules for easy visual scanning/diffing (matches the
    # same convention in qpansopy's own parameters_inspector_dialog.py).
    *parameters_inspector.py: E501
    # New OLS concept scripts: exec()-dispatched via plugin.py's
    # execute_script(), same `from qgis.core import *` / injected-namespace
    # pattern as the rest of qols/scripts/ (not yet covered by a blanket
    # scripts/*.py ignore because most other scripts/*.py files are already
    # flake8-clean). F403/F405 are inherent to the star-import dispatch
    # design; E402 is the imports-after-docstring-constants layout shared
    # by every script in this directory.
    # Reason: these aren't real bugs — flake8 can't resolve names that are
    # injected into the exec() namespace by plugin.py at dispatch time.
    # Unblocked by: TD-03 (doc/REFACTOR_PLAN.md) — converting scripts/ to
    # importable modules.
    *scripts/new-ols-oes-departure-UTM.py: F403,F405,E402
    *scripts/new-ols-oes-horizontal-UTM.py: F403,F405,E402
    *scripts/new-ols-oes-precision-approach-UTM.py: F403,F405,E402
    *scripts/new-ols-oes-straight-in-approach-UTM.py: F403,F405,E402
    *scripts/new-ols-oes-takeoff-climb-UTM.py: F403,F405,E402
    *scripts/new-ols-oes-transitional-UTM.py: F403,F405,E402
    *scripts/new-ols-ofs-approach-UTM.py: F403,F405,E402
